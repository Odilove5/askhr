[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "askhr"
dynamic = ["version"]
description = "Bilingual (FR/EN) HR assistant for businesses that answers staff questions from the company's own HR documents, cites its sources, and hands off to HR when it can't answer."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "pyyaml>=6.0.4",
    "types-pyyaml>=6.0.12.20261122",
]

[tool.hatch.version]
path = "src/askhr/__init__.py"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
